name: Package installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  linux:
    # Cible principale (cf. CLAUDE.md § Positionnement) — x86_64.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: mvn -B clean package

      - run: ./packaging/jpackage-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: printerbridge-linux-amd64-deb
          path: target/dist/*.deb

  linux-arm64:
    # Cible secondaire (Raspberry Pi/Raspbian, cf. CLAUDE.md § Positionnement). jpackage ne fait pas
    # de cross-compilation : ce job doit tourner SUR un runner arm64, d'où ubuntu-24.04-arm (runner
    # Linux arm64 hébergé par GitHub, gratuit sur dépôt public) plutôt que ubuntu-latest + émulation.
    # packaging/jpackage-linux.sh est déjà indépendant de l'architecture, aucune modif nécessaire.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: mvn -B clean package

      - run: ./packaging/jpackage-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: printerbridge-linux-arm64-deb
          path: target/dist/*.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: mvn -B clean package

      # WiX Toolset est préinstallé sur ce runner mais pas sur le PATH par défaut
      # (vérifié : jpackage --type msi échoue sinon avec "Can not find WiX tools").
      - name: Add WiX Toolset to PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:WIX\bin"

      - shell: pwsh
        run: ./packaging/jpackage-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: printerbridge-windows-msi
          path: target/dist/*.msi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: mvn -B clean package

      - run: ./packaging/jpackage-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: printerbridge-macos-pkg
          path: target/dist/*.pkg

  # Sans ce job, les .deb/.msi/.pkg n'existent que comme artefacts de run de workflow
  # (actions/upload-artifact) : leur téléchargement exige d'être connecté à GitHub — repéré via un
  # vrai retour utilisateur (v1.3.0), pas une supposition (cf. CLAUDE.md). Une vraie Release rend les
  # 3 installeurs publics, sans connexion, et donne une URL stable ("dernière version") pour un
  # script d'installation automatisé côté PluriBourse.
  release:
    needs: [linux, linux-arm64, windows, macos]
    # Seulement sur un vrai tag de version — un déclenchement manuel (workflow_dispatch) sans tag
    # associé n'a rien de cohérent à quoi rattacher une Release ; les jobs ci-dessus produisent quand
    # même leurs artefacts de run dans ce cas, pour tester une build sans publier quoi que ce soit.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # Le reste du workflow n'a besoin que de lire le repo (checkout) ; seul ce job élève le droit
      # nécessaire pour créer une Release, plutôt que d'accorder l'écriture à tout le workflow.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            dist/printerbridge-linux-amd64-deb/*.deb \
            dist/printerbridge-linux-arm64-deb/*.deb \
            dist/printerbridge-windows-msi/*.msi \
            dist/printerbridge-macos-pkg/*.pkg \
            --title "${{ github.ref_name }}" \
            --generate-notes
